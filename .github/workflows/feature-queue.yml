name: Manifest Feature Queue Drain
run-name: "Feature Queue Drain [${{ github.event_name }}]"

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Maximum number of issues to drain (1-10, default 1)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'

  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: feature-queue-${{ github.repository }}
  cancel-in-progress: false

jobs:
  drain:
    name: Drain feature queue
    # Schedule events run against the default branch; workflow_dispatch
    # can be run from any branch but we still only want default-branch drains.
    # PRD #186 FUI-002 — `format()` resolves the default branch at workflow
    # runtime so this guard works on both `master`- and `main`-default repos
    # without re-scaffolding.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: [self-hosted, singularity-theme-runner]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate max input
        id: validate
        env:
          MAX_INPUT: ${{ inputs.max }}
        run: |
          # Constrain MAX to a positive integer (1-10). Anything else falls back to 1.
          if [[ "$MAX_INPUT" =~ ^[0-9]+$ ]] && [[ "$MAX_INPUT" -ge 1 ]] && [[ "$MAX_INPUT" -le 10 ]]; then
            MAX="$MAX_INPUT"
          else
            MAX="1"
          fi
          echo "max=$MAX" >> "$GITHUB_OUTPUT"

      - name: Run manifest feature drain
        uses: ./.github/actions/manifest-run
        with:
          command: 'feature drain'
          project_name: '.'
          use_cwd: 'true'
          flags: '--max ${{ steps.validate.outputs.max }}'

      - name: Job summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
          MAX: ${{ steps.validate.outputs.max }}
        run: |
          {
            echo ""
            echo "## Feature Queue Drain"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Trigger** | ${EVENT_NAME} |"
            echo "| **Max** | ${MAX} |"
            echo "| **Status** | ${JOB_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
